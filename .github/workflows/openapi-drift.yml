# OpenAPI Drift Check — reusable workflow
#
# Generalises the OpenAPI drift-detection pattern: run a project-supplied
# `print-command` to emit the live OpenAPI spec, diff it against a committed
# spec file in the repo, and fail on any drift.
#
# Inputs:
#   print-command         (required) — command run inside `working-directory`
#                                       that prints the live OpenAPI spec to
#                                       stdout. Example:
#                                       `cargo run -p jtrader-server -- --print-openapi`.
#   committed-spec-path   (required) — path (relative to the repository
#                                       root) of the committed spec file
#                                       the live output is diffed against.
#   working-directory     (default `.`) — directory in which `print-command`
#                                       runs. Does NOT affect resolution
#                                       of `committed-spec-path`, which
#                                       is always repo-root-relative.
#   container-image       (default `ghcr.io/jcttech/devcontainer-rust-leptos:latest`)
#                                     — container image for the job pod
#                                       (ARC K8s mode).
#   code-paths            (default `''`) — D1 docs-only fast-lane filter.
#                                       Optional newline-separated glob list.
#                                       When set, the workflow's first
#                                       step runs `dorny/paths-filter@v4` on
#                                       PR events; if nothing matches, every
#                                       subsequent step is skipped (job
#                                       exits green in <30 s with no
#                                       `print-command` execution in the
#                                       log). Empty default = always run.
#                                       Push events always run regardless
#                                       of this filter.
#
# D1 fast-lane (per Spec jcttech/trading#185 §D1): the `code-paths:` input
# is the standardised docs-only skip mechanism shared by the new sibling
# reusable workflows in this repo. Each subsequent step is gated on
# `steps.gate.outputs.should-run`, which is `true` for non-PR events,
# `true` when `code-paths` is empty, otherwise the
# `dorny/paths-filter` boolean.
#
# **Behaviour change (jcttech/trading#200):** a `push` to the repository's
# DEFAULT BRANCH now bypasses the D1 fast-lane outright and always runs
# the real work — the fast-lane was a pull-request-only optimisation by
# design. The gate also FAILS OPEN when the filter reaches no verdict
# (skipped step, action error, mangled shell comparison — the failure mode
# behind #200 and PR #20), and any legitimate path-gated skip is written to
# `$GITHUB_STEP_SUMMARY` so it is never a silent green. PR behaviour is
# otherwise unchanged.
#
# Smoke-test stance (per Spec jcttech/trading#185 §D5): no self-test
# fixture lives inside this repo. Story F's trading-caller refactor is the
# end-to-end signal that catches input-surface or step-composition
# regressions before they reach unsuspecting consumers.

name: OpenAPI Drift Check

on:
  workflow_call:
    inputs:
      print-command:
        type: string
        required: true
        description: |
          Command run inside `working-directory` that prints the live
          OpenAPI spec to stdout.
          Example: `cargo run -p jtrader-server -- --print-openapi`.
      committed-spec-path:
        type: string
        required: true
        description: |
          Path (relative to the repository root) of the committed
          OpenAPI spec file to diff against the live output.
      working-directory:
        type: string
        default: '.'
        description: |
          Directory in which `print-command` runs. Does NOT affect
          resolution of `committed-spec-path`, which is always
          repo-root-relative.
      container-image:
        type: string
        default: 'ghcr.io/jcttech/devcontainer-rust-leptos:latest'
        description: |
          Container image for the job pod (ARC K8s mode). The default
          carries the toolchain needed to materialise the live spec for
          Leptos/utoipa-stack callers.
      code-paths:
        type: string
        default: ''
        description: |
          Optional newline-separated glob list (D1 fast-lane). When set,
          the workflow runs `dorny/paths-filter@v4` against these paths
          on PR events; if nothing matches, every subsequent step is
          skipped (job exits green in <30 s with no `print-command`
          execution). Empty default = always run. Push events always
          run regardless.

jobs:
  openapi-drift:
    name: OpenAPI Drift
    runs-on: github-arc-github-arc-runner-set
    container: ${{ inputs.container-image }}
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build paths-filter input
        id: build-filter
        if: inputs.code-paths != '' && github.event_name == 'pull_request'
        run: |
          PATHS=$(echo "${{ inputs.code-paths }}" | sed '/^$/d' | sed 's/^/      - /')
          echo "filters<<EOF" >> "$GITHUB_OUTPUT"
          echo "relevant:" >> "$GITHUB_OUTPUT"
          echo "$PATHS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Compute should-run from code-paths
        id: changes
        if: inputs.code-paths != '' && github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.build-filter.outputs.filters }}

      - name: Decide should-run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CODE_PATHS: ${{ inputs.code-paths }}
          FILTER_RESULT: ${{ steps.changes.outputs.relevant }}
        run: |
          # POSIX sh only -- these images may not carry bash (see PR #20).
          #
          # The D1 fast-lane (jcttech/trading#185 D1) is a PULL-REQUEST-ONLY
          # optimisation. A push to the DEFAULT BRANCH is the canonical
          # ground-truth build, so it bypasses the path filter entirely and
          # always runs the real work -- jcttech/trading#200 option 2.
          if [ "$EVENT_NAME" = "push" ] && [ -n "$DEFAULT_BRANCH" ] \
             && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            RUN=true
            REASON="push to the default branch ($DEFAULT_BRANCH); D1 fast-lane bypassed"
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            RUN=true
            REASON="event '$EVENT_NAME' is not a pull_request; D1 fast-lane does not apply"
          elif [ -z "$CODE_PATHS" ]; then
            RUN=true
            REASON="no code-paths filter configured"
          elif [ "$FILTER_RESULT" = "true" ]; then
            RUN=true
            REASON="code-paths matched the pull-request diff"
          elif [ "$FILTER_RESULT" = "false" ]; then
            RUN=false
            REASON="no file in the pull-request diff matched code-paths"
          else
            # The filter reached no verdict: its step was skipped, the action
            # failed, or the shell mangled the gate (the exact failure mode
            # behind jcttech/trading#200 and PR #20). FAIL OPEN -- run the real
            # work rather than report a silent green.
            RUN=true
            REASON="path filter reached no verdict; running anyway (fail-open)"
          fi
          echo "should-run=$RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "should-run=$RUN ($REASON)"

      - name: Report path-gated skip
        if: steps.gate.outputs.should-run != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          {
            echo "### Skipped: OpenAPI Drift (path-gated)"
            echo
            echo "No build or test ran in this job -- it was gated off by the"
            echo "D1 code-paths fast-lane, not executed and passed."
            echo
            echo "Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate live OpenAPI spec
        if: steps.gate.outputs.should-run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.print-command }} > /tmp/openapi.yaml.gen

      - name: Diff against committed spec
        if: steps.gate.outputs.should-run == 'true'
        run: diff -u "${{ inputs.committed-spec-path }}" /tmp/openapi.yaml.gen
