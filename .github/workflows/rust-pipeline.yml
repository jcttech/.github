          retention-days: ${{ inputs.cargo-tests-archive-retention-days }}
          compression-level: 0   # already zstd
          overwrite: true        # a re-run of this job replaces the earlier attempt's
          if-no-files-found: error

      - name: Upload the test archive (slot 2)
        if: steps.archive.outputs.slot-2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJson(needs.changes.outputs.cargo-tests-archive).artifact }}-2
          path: ${{ steps.archive.outputs.dir }}/slot-2
          retention-days: ${{ inputs.cargo-tests-archive-retention-days }}
          compression-level: 0   # already zstd
          overwrite: true        # a re-run of this job replaces the earlier attempt's
