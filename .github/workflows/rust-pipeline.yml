      - name: Upload the test archive (slot 0)
        if: steps.archive.outputs.slot-0 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJson(needs.changes.outputs.cargo-tests-archive).artifact }}-0
