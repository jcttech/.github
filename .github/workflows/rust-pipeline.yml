          path: ${{ steps.archive.outputs.dir }}/slot-10
          retention-days: ${{ inputs.cargo-tests-archive-retention-days }}
          compression-level: 0   # already zstd
          overwrite: true        # a re-run of this job replaces the earlier attempt's
          if-no-files-found: error

      - name: Upload the test archive (slot 11)
        if: steps.archive.outputs.slot-11 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJson(needs.changes.outputs.cargo-tests-archive).artifact }}-11
          path: ${{ steps.archive.outputs.dir }}/slot-11
          retention-days: ${{ inputs.cargo-tests-archive-retention-days }}
          compression-level: 0   # already zstd
          overwrite: true        # a re-run of this job replaces the earlier attempt's
          if-no-files-found: error

      - name: Archive ready
        id: ready
        if: steps.archive.outcome == 'success'
        shell: bash
        env:
          TOTAL: ${{ steps.archive.outputs.total-bytes }}
          WARN_MIB: ${{ inputs.cargo-tests-archive-warn-mib }}
        run: |
          secs=$(( $(date +%s) - ${CARGO_TESTS_UPLOAD_T0:-$(date +%s)} ))
          mib=$(( TOTAL / 1048576 ))
          rate=$(awk -v b="$TOTAL" -v s="$secs" 'BEGIN { if (s > 0) printf "%.1f MB/s", b / s / 1e6; else print "n/a" }')
          {
            echo
            echo "Uploaded ${mib} MiB of test archives in $((secs / 60))m$((secs % 60))s ($rate)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$mib" -gt "${WARN_MIB:-2048}" ]; then
            msg="the test archives are ${mib} MiB (over cargo-tests-archive-warn-mib, ${WARN_MIB} MiB) and took $((secs / 60))m$((secs % 60))s to upload; every lane waits for that and then downloads its share. Fewer test binaries (each links the whole dependency graph) is the fix; CARGO_PROFILE_TEST_STRIP=debuginfo in cargo-tests-build-env saves about a quarter; cargo-tests-build-once: false goes back to per-lane builds."
            echo "::warning title=cargo-tests archive size::$msg"
            { echo; echo "> **Warning:** $msg"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=ready" >> "$GITHUB_OUTPUT"

      - name: Doc tests
        id: doctests
        if: >-
          steps.archive.outcome == 'success' &&
          fromJson(needs.changes.outputs.cargo-tests-archive).doctests
        shell: bash
        env:
          PKGS: ${{ steps.features.outputs.packages }}
          FEATS: ${{ steps.features.outputs.features }}
          LANES: ${{ steps.features.outputs.lanes }}
        run: |
          set -uo pipefail -f
          # The doc tests, run once against the archive's build: the same -p and
          # --features selection as `cargo nextest archive`, so nothing recompiles.
          # Each crate's result is attributed back to the lanes that asked for doc
          # tests (`doctests: 'true'`); the lane's own check fails on it.
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          manifest="$GITHUB_WORKSPACE/$CT_MANIFEST"
          log="$RUNNER_TEMP/cargo-tests-doctests.log"
          a=(); for p in $PKGS; do a+=(-p "$p"); done
          [ -n "$FEATS" ] && a+=(--features "$FEATS")

          mapfile -t doclanes < <(jq -r --argjson keep "$LANES" '.["doctest-lanes"] | to_entries[] | select(.key as $k | $keep | index($k)) | .key' <<<"$ARCHIVE_PLAN")
          if [ "${#doclanes[@]}" -eq 0 ]; then
            echo "No lane in the archive asks for doc tests."
            out doctests '{}'
            exit 0
          fi

          start=$(date +%s)
          CARGO_TERM_COLOR=never cargo test --doc --no-fail-fast --manifest-path "$manifest" "${a[@]}" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          secs=$(( $(date +%s) - start ))

          # crate name -> package
          declare -A pkg_of
          while IFS=$'\t' read -r c p; do pkg_of[$c]="$p"; done < <(
            cargo metadata --no-deps --format-version 1 --manifest-path "$manifest" | jq -r '
              .packages[] | .name as $p | .targets[]
              | select(any(.kind[]; . == "lib" or . == "rlib" or . == "dylib" or . == "proc-macro"))
              | "\(.name | gsub("-"; "_"))\t\($p)"')
          failed=" "
          while read -r c; do [ -n "$c" ] && failed+="${pkg_of[$c]:-$c} "; done < <(
            awk '/^[[:space:]]*Doc-tests /{ c = $2 } /^test result: FAILED/{ print c }' "$log" | sort -u)
          unattributed=false
          [ "$rc" -ne 0 ] && [ "$failed" = " " ] && unattributed=true

          verdicts='{}'; bad=false; requested=" "
          for n in "${doclanes[@]}"; do
            v=passed
            for p in $(jq -r --arg n "$n" '.["doctest-lanes"][$n]' <<<"$ARCHIVE_PLAN"); do
              requested+="$p "
              case "$failed" in *" $p "*) v=failed ;; esac
            done
            [ "$unattributed" = true ] && v=failed
            [ "$v" = failed ] && bad=true
            verdicts=$(jq -c --arg n "$n" --arg v "$v" '. + {($n): $v}' <<<"$verdicts")
          done
          for p in $failed; do
            case "$requested" in *" $p "*) ;; *) echo "::warning title=cargo-tests doc tests::$p's doc tests failed; no lane asks for them (doctests: 'true'), so nothing fails on it" ;; esac
          done
          out doctests "$verdicts"
          {
            echo "## cargo-tests: doc tests (${secs}s, exit $rc)"
            echo
            failed_list=$(printf '%s' "$failed" | awk '{$1=$1};1')
            echo "Run once against the archive's build. Failed packages: \`${failed_list:-none}\`"
            [ "$unattributed" = true ] && echo "cargo failed without a failing doc-test result to attribute: every lane that asked for doc tests fails."
            echo
            echo "| Lane | Doc tests |"
            echo "|---|---|"
            for n in "${doclanes[@]}"; do echo "| $n | $(jq -r --arg n "$n" '.[$n]' <<<"$verdicts") |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bad" = true ]; then
            echo "::error title=cargo-tests doc tests::doc tests failed for: $(jq -r 'to_entries | map(select(.value == "failed") | .key) | join(", ")' <<<"$verdicts") (see the log above; each of those lanes fails on it)"
            exit 1
          fi
          exit 0

  # Matrix-driven cargo test splits — see `enable-cargo-tests` /
  # `cargo-tests` inputs. One lane per entry, each its own status check,
  # `cargo-tests (<name>) / <name>` (an explicit job name: v2 rendered the
  # whole matrix entry, command text included, into the middle part). The
  # matrix is the `changes` job's plan: every entry, with its gate verdict,
  # whether it runs from the archive, and its commands. A lane runs even
  # when the archive job failed, so that it FAILS (pointing at that job)
  # rather than being skipped. The chain-gate toggles on `serialize-jobs`
  # do NOT apply here: cargo-tests entries are independent of each other
  # and of the openapi-drift / web-build chain by design.
  cargo-tests:
    name: cargo-tests (${{ matrix.entry.name }})
    needs: [changes, cargo-tests-archive]
    # The trailing `push`-to-default-branch clause bypasses the D1
    # fast-lane on the canonical ground-truth build (jcttech/trading#200
    # option 2). See the note above the `changes` job.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      inputs.enable-cargo-tests &&
      (startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch))
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.changes.outputs.cargo-tests-lanes || inputs.cargo-tests) }}
    # Pinned to this workflow's own major: the lanes need the v3 inputs.
    uses: jcttech/.github/.github/workflows/cargo-tests.yml@v3
    secrets: inherit
    with:
      # `${{ expr || 'default' }}` fallbacks here are load-bearing —
      # when a matrix entry omits an optional key, the GitHub
      # expression evaluator passes empty string to the called
      # workflow, which OVERRIDES the called workflow's input default
      # (an empty string is not "missing", it's "explicitly empty").
      # For `postgres-image`, an empty string skips the entire service
      # container start, which breaks every with-postgres="true"
      # caller — see PR #281 run 26703782289.
      name: ${{ matrix.entry.name }}
      command: ${{ matrix.entry.command }}
      with-postgres: ${{ matrix.entry.with-postgres || 'false' }}
      postgres-image: ${{ matrix.entry.postgres-image || 'postgres:18' }}
      pre-test-script: ${{ matrix.entry.pre-test-script || '' }}
      init-sql: ${{ matrix.entry.init-sql || '' }}
      code-paths: ${{ matrix.entry.code-paths || '' }}
      working-directory: ${{ matrix.entry.working-directory || '.' }}
      runner: ${{ inputs.runner }}
      container-image: ${{ inputs.container-image }}
      rust-version: ${{ inputs.rust-version }}
      should-run: ${{ matrix.entry.run || '' }}
      should-run-reason: ${{ matrix.entry.run-reason || '' }}
      # Archive lanes not moved off the archive by the feature check: their
      # own artifact (one per lane). If the archive job failed there is none,
      # and `archive-status` fails the lane.
      archive-artifact: >-
        ${{ (matrix.entry.mode == 'archive' &&
             !contains(fromJson(needs.cargo-tests-archive.outputs.excluded || '[]'), matrix.entry.name) &&
             (fromJson(needs.cargo-tests-archive.outputs.lane-archives || '{}')[matrix.entry.name].artifact ||
              format('{0}-missing', fromJson(needs.changes.outputs.cargo-tests-archive).artifact))) || '' }}
      archive-file: ${{ fromJson(needs.cargo-tests-archive.outputs.lane-archives || '{}')[matrix.entry.name].file || '' }}
      archive-status: ${{ needs.cargo-tests-archive.outputs.status || needs.cargo-tests-archive.result }}
      archive-command: ${{ matrix.entry.archive-command || '' }}
      archive-target-dir: ${{ needs.cargo-tests-archive.outputs.target-dir }}
      archive-workspace-root: ${{ needs.cargo-tests-archive.outputs.workspace-root }}
      archive-github-workspace: ${{ needs.cargo-tests-archive.outputs.github-workspace }}
      doctests-verdict: >-
        ${{ (matrix.entry.mode == 'archive' && matrix.entry.doctests == 'true' &&
             (fromJson(needs.cargo-tests-archive.outputs.doctests || '{}')[matrix.entry.name] || 'missing')) || '' }}


  # ── cargo-tests: delete the run's archives once they've served (v3) ──
  # Every lane passed: nothing will re-run, so the archives only cost
  # Actions storage until retention removes them. Any lane failed or the
  # run was cancelled: keep them for "Re-run failed jobs" (which re-runs
  # this job after the lanes, so a green re-run deletes them then). The
  # job never fails the run. No `permissions:` on purpose: a nested job
  # can't be granted more than its caller's token, and asking for
  # `actions: write` here would make every caller that doesn't grant it
  # fail at startup, so it uses the caller's token as it comes and stops
  # with a notice when that can't delete.
  cargo-tests-archive-cleanup:
    name: cargo-tests-archive-cleanup
    needs: [changes, cargo-tests-archive, cargo-tests]
    if: >-
      !cancelled() && inputs.cargo-tests-archive-cleanup &&
      needs.cargo-tests-archive.result == 'success' &&
      needs.cargo-tests.result == 'success'
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    steps:
      - name: Delete this run's test archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ fromJson(needs.changes.outputs.cargo-tests-archive).artifact }}-
        run: |
          set -uo pipefail
          api="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/actions"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          note() {
            echo "::notice title=cargo-tests archive cleanup::$1"
            { echo "## cargo-tests archive cleanup"; echo; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"
          }
          if ! list=$(curl -fsS "${auth[@]}" "$api/runs/$GITHUB_RUN_ID/artifacts?per_page=100"); then
            note "Could not list this run's artifacts; the test archives stay until retention removes them."
            exit 0
          fi
          mapfile -t rows < <(jq -r --arg p "$PREFIX" '.artifacts[] | select(.name | startswith($p)) | "\(.id) \(.size_in_bytes) \(.name)"' <<<"$list")
          if [ "${#rows[@]}" -eq 0 ]; then
            note "No test archives of this run left to delete."
            exit 0
          fi
          deleted=0; bytes=0; denied=false
          for r in "${rows[@]}"; do
            read -r id size name <<<"$r"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${auth[@]}" "$api/artifacts/$id" || echo 000)
            case "$code" in
              204) deleted=$((deleted + 1)); bytes=$((bytes + size)); echo "Deleted $name ($((size / 1048576)) MiB)." ;;
              404) echo "$name is already gone." ;;
              401|403) denied=true; break ;;
              *) echo "::warning title=cargo-tests archive cleanup::deleting $name returned HTTP $code; it stays until retention removes it" ;;
            esac
          done
          if [ "$denied" = true ]; then
            note "The workflow token can't delete artifacts: grant \`actions: write\` to the job that calls rust-pipeline.yml to have the test archives deleted when every lane passes (or set cargo-tests-archive-cleanup: false to skip this job). They stay until cargo-tests-archive-retention-days removes them."
          else
            note "Every lane passed: deleted $deleted test archive(s), $((bytes / 1048576)) MiB."
          fi
          exit 0

  openapi-drift:
    needs: changes
    if: >-
      !cancelled() &&
      inputs.enable-openapi-drift &&
      (startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch))
    uses: jcttech/.github/.github/workflows/openapi-drift.yml@v1
    secrets: inherit
    with:
      print-command: ${{ inputs.openapi-drift-print-command }}
      committed-spec-path: ${{ inputs.openapi-drift-committed-spec-path }}
      working-directory: ${{ inputs.openapi-drift-working-directory }}
      container-image: ${{ inputs.openapi-drift-container-image }}
      code-paths: ${{ inputs.openapi-drift-code-paths }}

  web-build:
    needs: [changes, openapi-drift]
    if: >-
      !cancelled() &&
      inputs.enable-web-build &&
      (!inputs.serialize-jobs ||
        needs.openapi-drift.result == 'success' ||
        needs.openapi-drift.result == 'skipped') &&
      (startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch))
    uses: jcttech/.github/.github/workflows/leptos-web-build.yml@v1
    secrets: inherit
    with:
      working-directory: ${{ inputs.web-build-working-directory }}
      web-package: ${{ inputs.web-build-web-package }}
      build-command: ${{ inputs.web-build-build-command }}
      bindings-command: ${{ inputs.web-build-bindings-command }}
      wall-script: ${{ inputs.web-build-wall-script }}
      wasm-size-artifact: ${{ inputs.web-build-wasm-size-artifact }}
      container-image: ${{ inputs.web-build-container-image }}
      code-paths: ${{ inputs.web-build-code-paths }}

  docs:
    needs: changes
    if: >-
      inputs.enable-docs &&
      (github.event_name == 'pull_request' ||
      needs.changes.outputs.code == 'true')
    uses: jcttech/.github/.github/workflows/rust-docs.yml@v1
    secrets: inherit
    with:
      rust-version: ${{ inputs.rust-version }}
      doc-args: ${{ inputs.doc-args }}
      enable-rustdoc: ${{ inputs.enable-rustdoc }}
      runner: ${{ inputs.runner }}
      container-image: ${{ inputs.container-image }}

  docker:
    needs: [changes, build, cargo-tests-archive, cargo-tests, openapi-drift, web-build]
    if: >-
      !failure() && !cancelled() &&
      inputs.enable-docker &&
      (startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'))
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download binary artifact
        if: inputs.binary-name != '' && inputs.container-image == ''
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: ./artifact

      - name: Retrieve binary from shared cache
        if: inputs.binary-name != '' && inputs.container-image != ''
        run: |
          mkdir -p ./artifact
          cp /cache/workflow/${{ github.run_id }}/${{ inputs.binary-name }} ./artifact/

      - name: Prepare binary
        if: inputs.binary-name != ''
        run: chmod +x ./artifact/${{ inputs.binary-name }}

      - name: Login to registry (Docker)
        if: inputs.container-image == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure podman storage (rootless overlay via fuse-overlayfs)
        if: inputs.container-image != ''
        run: |
          # Rootless podman in an unprivileged container can't mount real
          # overlayfs. Force the userspace fuse-overlayfs helper so
          # overlay works without CAP_SYS_ADMIN. Requires /dev/fuse
          # exposed by the runner pod template.
          if [ ! -e /dev/fuse ]; then
            echo "::warning::/dev/fuse not present — fuse-overlayfs will fail; pod template needs to expose it"
          fi
          mkdir -p "$HOME/.config/containers"
          cat > "$HOME/.config/containers/storage.conf" <<'EOF'
          [storage]
          driver = "overlay"

          [storage.options]
          mount_program = "/usr/bin/fuse-overlayfs"
          EOF

      - name: Login to registry (Podman)
        if: inputs.container-image != ''
        run: podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push
        uses: jcttech/.github/.github/actions/docker-build@v1
        with:
          sha: ${{ needs.build.outputs.sha_short }}
          image-name: ${{ inputs.image-name }}
          dockerfile: ${{ inputs.ci-dockerfile || inputs.dockerfile }}
          tag-prefix: ${{ inputs.tag-prefix }}

  release:
    needs: [build, docker, cargo-tests-archive, cargo-tests, openapi-drift, web-build]
    if: >-
      !failure() && !cancelled() &&
      inputs.enable-release &&
      startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix))
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download binary artifact
        if: inputs.binary-name != '' && inputs.container-image == ''
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: ./artifacts

      - name: Retrieve binary from shared cache
        if: inputs.binary-name != '' && inputs.container-image != ''
        run: |
          mkdir -p ./artifacts
          cp /cache/workflow/${{ github.run_id }}/${{ inputs.binary-name }} ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*

      - name: Cleanup shared cache
        if: always() && inputs.container-image != ''
        run: rm -rf /cache/workflow/${{ github.run_id }}
