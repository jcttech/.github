# Rust Pipeline — reusable workflow (@v3)
#
# Aggregates change detection, build/clippy/test, optional sibling
# workflows (cargo-tests matrix, openapi-drift, leptos-web-build,
# rust-docs), Docker image build/push, and tagged GitHub releases
# under one caller-friendly entry point. Each sibling is opt-in via
# an `enable-*` flag (default `false` for the opt-in sub-jobs,
# default `true` for build/docker/release). Pass-through inputs for
# each sibling are prefixed `<sub-job>-*` so callers can configure
# them without colliding on shared names like `code-paths` or
# `container-image`.
#
# `serialize-jobs:` toggle: when `true`, the chain
# `openapi-drift → web-build` runs fail-fast — a chain link only
# proceeds if the previous link reported `success` or was skipped
# (a failure cascades into a skip on the next link, mirroring the
# in-repo `needs:` chain pattern). When `false` (the default),
# failures don't cascade between chain links: each enabled link
# runs independently. The wall-clock `needs:` chain is static —
# GitHub Actions doesn't support dynamic `needs:`, so non-serial
# mode still waits for the previous link to finish before starting
# the next; the toggle controls failure propagation, not literal
# parallelism. `docker` and `release` keep their pre-existing
# `!failure() && !cancelled()` semantics — failure of any chain
# link still blocks the image push and the release artifact upload.
#
# @v2 — Breaking change from @v1
#
# The legacy single-command `enable-database-tests` path and its
# `database-test-command` / `database-tests-*` inputs are REMOVED.
# Callers that used `enable-database-tests: true` must migrate to
# the matrix-driven `enable-cargo-tests: true` + `cargo-tests:`
# JSON array shape. The sibling `rust-database-tests.yml` still
# exists in this repo and can still be called directly, but
# `rust-pipeline.yml@v2` no longer dispatches to it. See the
# `enable-cargo-tests` input docstring for the matrix entry schema.
#
# @v3 — cargo-tests: build once, run everywhere (jcttech/trading#1160)
#
# v2 built and linked every cargo-tests lane's test binaries in the
# lane's own pod. sccache serves the crate compiles, but linking isn't
# cached, so overlapping lanes linked the same heavy binaries again and a
# re-run of one failed lane rebuilt it. v3 builds the TRIGGERED lanes'
# test binaries once, in a `cargo-tests-archive` job (`cargo nextest
# archive`), uploads the archive as an artifact of the run, and every
# lane downloads it and runs its partition (`-E 'package(=…)'`). A re-run
# of a failed lane reuses the archive; it builds nothing.
#
# It is the DEFAULT (`cargo-tests-build-once: true`) for lanes that say
# what they build — the structured `packages` field (see
# `enable-cargo-tests`). Everything else keeps v2's per-lane behaviour:
#   - `cargo-tests-build-once: false` (the opt-out; v2 exactly);
#   - an entry's `build-once: 'false'`;
#   - a legacy entry with only `command` (the pipeline can't tell what a
#     free-form command builds);
#   - no cargo-nextest in the image;
#   - fewer than two triggered lanes qualify (nothing to share);
#   - `cargo-tests-feature-check: strict` and the lane's workspace crates
#     would compile with other features in the union.
# Gating reuses what consumers already write: the per-lane `code-paths`
# are evaluated once, in `changes`, with v2's rules (pull requests only;
# fail-open), and the archive holds only the union of the lanes they
# triggered. The archive job runs only when two or more triggered lanes
# run from it. Doc tests (nextest archives carry none) run in the archive
# job against the same build and are attributed back to the lanes.
#
# Check names: each lane is `cargo-tests (<name>) / <name>` (v2 rendered
# the whole matrix entry into the middle part, command text included);
# the new job is `cargo-tests-archive`.

name: Rust Pipeline

on:
  workflow_call:
    inputs:
      code-paths:
        type: string
        default: |
          src/**
          Cargo.toml
          Cargo.lock
          Dockerfile
          tests/**
        description: 'Newline-separated glob patterns for code files'
      rust-version:
        type: string
        default: 'stable'
      enable-docker:
        type: boolean
        default: true
      enable-release:
        type: boolean
        default: true
      enable-build:
        type: boolean
        default: true
        description: 'Enable build, clippy, and test job'
      enable-docs:
        type: boolean
        default: false
        description: 'Enable rustdoc generation and documentation coverage'
      enable-rustdoc:
        type: boolean
        default: true
        description: 'Enable rustdoc generation (only applies when enable-docs is true)'
      doc-args:
        type: string
        default: '--workspace --no-deps --document-private-items'
        description: 'Arguments passed to cargo doc'
      enable-cargo-tests:
        type: boolean
        default: false
        description: |
          Opt into the matrix-driven `cargo-tests.yml` sub-job. Lets
          callers split their test surface into multiple named entries
          (Unit, Integration, Server, etc.) that run in parallel, each
          with its own command, optional Postgres sidecar, optional
          bootstrap script, and optional path filter. Provide the matrix
          via `cargo-tests` (JSON array). Since v3, lanes that declare
          their `packages` run from one shared test archive by default
          (`cargo-tests-build-once`).
      cargo-tests:
        type: string
        default: '[]'
        description: |
          JSON array of matrix entries, one lane each (`cargo-tests.yml`).
          Each entry object may contain:
            name              (string, required) — display name; becomes the status check label
            command           (string) — free-form shell; what the lane runs when it builds
                                its own test binaries. Required unless `packages` is set.
            with-postgres     (string, default 'false') — 'true' spins up the Postgres sidecar
            postgres-image    (string, default 'postgres:18')
            pre-test-script   (string, default '') — caller-relative bash bootstrap
            init-sql          (string, default '') — caller-relative SQL bootstrap (psql)
            code-paths        (string, default '') — newline-separated globs; empty = always run
            working-directory (string, default '.') — cwd for the test command
          v3 structured fields (an entry with `packages` can run from the shared archive):
            packages          (string) — space/newline-separated workspace packages (the `-p` list)
            features          (string, default '') — cargo features (`pkg/feature` form recommended)
            profile           (string, default '') — nextest profile
            filter            (string, default '') — nextest filterset, ANDed with the packages
            nextest-args      (string, default '') — other `cargo nextest run` args, e.g.
                                `--run-ignored only --test-threads 1` (no -p/-E/--features/
                                --profile/--manifest-path: use the fields above)
            doctests          ('true'|'false', default 'false') — the packages' doc tests must pass
            setup             (string, default '') — shell run before the tests, same step
                                (start a service, `export` its URL)
            test-wrapper      (string, default '') — prefix for the test command
            build-once        ('true'|'false', default 'true') — 'false': this lane builds itself
            build-jobs        (string, default `cargo-tests-build-jobs`) — CARGO_BUILD_JOBS when
                                this lane builds itself; '' = unset
          With `packages` and no `command`, the lane's own build-and-test command
          is composed from the fields; with both, `command` is used whenever the
          lane builds itself and the fields drive the archive path.
          Example: '[{"name":"Unit","packages":"foo","doctests":"true"},{"name":"Integration","packages":"bar baz","profile":"ci","with-postgres":"true","pre-test-script":"./scripts/migrate.sh"}]'
      cargo-tests-build-once:
        type: boolean
        default: true
        description: |
          Build the triggered structured lanes' test binaries once
          (`cargo-tests-archive` job, `cargo nextest archive`) and run
          every lane from that archive. `false` restores v2 exactly: no
          archive job, each lane builds and tests in its own pod.
      cargo-tests-manifest-path:
        type: string
        default: 'Cargo.toml'
        description: |
          Repo-root-relative path of the workspace manifest the structured
          lanes build from (e.g. `jtrader/Cargo.toml`).
      cargo-tests-build-jobs:
        type: string
        default: '1'
        description: |
          `CARGO_BUILD_JOBS` for the archive build and for structured lanes
          that build themselves (an entry's `build-jobs` overrides it).
          Conservative on purpose: one rustc or link resident at a time is
          what keeps the big test binaries' links inside the runner pod's
          memory (jcttech/trading#201). Raise it on measured headroom. ''
          leaves it unset (cargo's default: one job per CPU).
      cargo-tests-build-env:
        type: string
        default: ''
        description: |
          Newline-separated `KEY=VALUE` lines exported for every build the
          pipeline composes: the archive build, its doc tests, and the
          structured lanes that build themselves (e.g.
          `CARGO_PROFILE_DEV_DEBUG=line-tables-only`). A legacy `command`
          is run as written, without them.
      cargo-tests-build-wrapper:
        type: string
        default: ''
        description: |
          Command prefix the archive build (and a structured lane's own
          build) runs under, e.g. `bash scripts/ci/mem-probe.sh build --`.
          Runs from the repository root.
      cargo-tests-feature-check:
        type: string
        default: 'report'
        description: |
          Cargo unifies features across the packages of one build, so a
          lane's crates can compile with more features in the shared
          archive than in a build of that lane alone (`cargo test
          --workspace` has the same property). `report`: share the archive
          and list, per lane, the workspace crates whose features differ in
          the `cargo-tests-archive` job summary. `strict`: those lanes build
          on their own instead. `off`: skip the check.
      cargo-tests-archive-warn-mib:
        type: number
        default: 2048
        description: |
          Warn (annotation + job summary) when one run's test archives add
          up to more than this many MiB. Every archive is uploaded once and
          each lane downloads its own; on trading's runners that moved about
          9 MB/s up, so 9 GB of archives cost 17 minutes before any lane
          started. The fixes: fewer test binaries (each statically links the
          whole dependency graph), `CARGO_PROFILE_TEST_STRIP=debuginfo` in
          `cargo-tests-build-env` (about 28 % smaller, at the cost of line
          numbers in backtraces), or `cargo-tests-build-once: false`.
      cargo-tests-archive-retention-days:
        type: number
        default: 1
        description: |
          Retention of the test-archive artifacts. A lane re-run after they
          expired builds its own test binaries (with a warning).
      cargo-tests-archive-cleanup:
        type: boolean
        default: true
        description: |
          Delete the run's test archives once every cargo-tests lane has
          succeeded (`cargo-tests-archive-cleanup` job); keep them when a
          lane failed or the run was cancelled, so "Re-run failed jobs"
          still finds them (retention removes them later). Deleting needs
          `actions: write` on the token the CALLER grants: a called
          workflow can't raise its caller's permissions, and a job here that
          asked for it would stop every caller that doesn't grant it from
          starting. Without it the job says so in a notice and passes; the
          archives then expire after `cargo-tests-archive-retention-days`.
      enable-openapi-drift:
        type: boolean
        default: false
        description: |
          Opt into the OpenAPI drift-detection sub-job. When `true`,
          `openapi-drift-print-command` and
          `openapi-drift-committed-spec-path` MUST also be set (those
          inputs are required on the underlying reusable workflow).
      openapi-drift-print-command:
        type: string
        default: ''
        description: |
          Forwarded to `openapi-drift.yml` as `print-command`. Command
          run inside `openapi-drift-working-directory` that prints the
          live OpenAPI spec to stdout (e.g.
          `cargo run -p server -- --print-openapi`). Required when
          `enable-openapi-drift` is `true`.
      openapi-drift-committed-spec-path:
        type: string
        default: ''
        description: |
          Forwarded to `openapi-drift.yml` as `committed-spec-path`.
          Repo-root-relative path of the committed OpenAPI spec to
          diff the live output against. Required when
          `enable-openapi-drift` is `true`.
      openapi-drift-working-directory:
        type: string
        default: '.'
        description: |
          Forwarded to `openapi-drift.yml` as `working-directory`.
          Directory in which `openapi-drift-print-command` runs.
      openapi-drift-container-image:
        type: string
        default: 'ghcr.io/jcttech/devcontainer-rust-leptos:latest'
        description: |
          Forwarded to `openapi-drift.yml` as `container-image`.
          Container image for the openapi-drift job pod.
      openapi-drift-code-paths:
        type: string
        default: ''
        description: |
          Newline-separated glob list forwarded to `openapi-drift.yml`
          as `code-paths` (D1 fast-lane). Empty default = always run.
      enable-web-build:
        type: boolean
        default: false
        description: |
          Opt into the Leptos web-build + size-gate sub-job.
      web-build-working-directory:
        type: string
        default: '.'
        description: |
          Forwarded to `leptos-web-build.yml` as `working-directory`.
      web-build-web-package:
        type: string
        default: 'web'
        description: |
          Forwarded to `leptos-web-build.yml` as `web-package`. Leptos
          hydrate-side crate name (e.g. `jtrader-web`).
      web-build-build-command:
        type: string
        default: 'make web-build'
        description: |
          Forwarded to `leptos-web-build.yml` as `build-command`.
          Release build + size-gate command run in
          `web-build-working-directory`.
      web-build-bindings-command:
        type: string
        default: 'make web-check-bindings'
        description: |
          Forwarded to `leptos-web-build.yml` as `bindings-command`.
          OpenAPI ⇄ client drift-check command. Pass `''` to skip.
      web-build-wall-script:
        type: string
        default: ''
        description: |
          Forwarded to `leptos-web-build.yml` as `wall-script`. Opt-in
          path to a project-specific lint/wall gate script. Pass `''`
          to skip.
      web-build-wasm-size-artifact:
        type: string
        default: ''
        description: |
          Forwarded to `leptos-web-build.yml` as `wasm-size-artifact`.
          Repo-root-relative path of a single file uploaded as an
          artefact. Pass `''` to skip.
      web-build-container-image:
        type: string
        default: 'ghcr.io/jcttech/devcontainer-rust-leptos:latest'
        description: |
          Forwarded to `leptos-web-build.yml` as `container-image`.
          Must carry cargo-leptos / wasm-bindgen-cli / wasm-opt /
          wasm32-unknown-unknown on `PATH`.
      web-build-code-paths:
        type: string
        default: ''
        description: |
          Newline-separated glob list forwarded to `leptos-web-build.yml`
          as `code-paths` (D1 fast-lane). Empty default = always run.
      serialize-jobs:
        type: boolean
        default: false
        description: |
          When `true`, the chain `openapi-drift → web-build` runs
          fail-fast: each chain link only proceeds if the previous link
          reported `success` or was skipped (failure cascades). When
          `false` (the default), failures don't cascade between chain
          links — each enabled link runs independently. The `needs:`
          chain itself is static (GitHub Actions doesn't support
          dynamic `needs:`), so non-serial mode still waits for the
          previous link to finish before starting; the flag controls
          failure propagation, not literal parallelism. `docker` and
          `release` always cascade failures from any chain link via
          their pre-existing `!failure()` semantics, regardless of this
          flag. The `cargo-tests` matrix (if enabled) runs independently
          of this chain — see that job's comment for details.
      tag-prefix:
        type: string
        default: ''
        description: 'Tag prefix for multi-binary workspaces (e.g. "session-manager/")'
      image-name:
        type: string
        default: ''
        description: 'Docker image name (defaults to github.repository)'
      dockerfile:
        type: string
        default: 'Dockerfile'
        description: 'Path to Dockerfile'
      binary-name:
        type: string
        default: ''
        description: 'Binary name to extract from build artifact for CI Docker image'
      ci-dockerfile:
        type: string
        default: ''
        description: 'CI-specific Dockerfile that copies pre-built binary (skips compilation)'
      runner:
        type: string
        default: 'github-arc-github-arc-runner-set'
        description: 'Runner label for build/test jobs'
      container-image:
        type: string
        default: 'ghcr.io/jcttech/devcontainer-rust:latest'
        description: 'Container image for job pods (required for ARC K8s mode, empty string for GHA runners)'
      sccache-recache:
        type: boolean
        default: false
        description: |
          When `true`, sets `SCCACHE_RECACHE=true` on the build job so
          rustc compilations bypass existing sccache entries and write
          fresh objects. Use to recover from poisoned cache on a
          persistent self-hosted `SCCACHE_DIR` (e.g. ICE / SIGSEGV
          from stale rustc objects after a toolchain bump). One-shot:
          flip back to `false` once the cache has been rewritten.

jobs:
  # Top-level path filter. On `pull_request` events this is the D1
  # fast-lane's coarse gate; on a `push` to the DEFAULT BRANCH it is
  # advisory only — every gated job below carries an explicit
  # `push`-to-default-branch clause that runs it regardless of the
  # filter verdict.
  #
  # Why: `dorny/paths-filter` on a push event compares against the
  # pushed range, which for a squash-merge to main is a single commit.
  # A merge that touched no filtered path (or where the filter reached
  # no verdict at all) previously skipped the real build while the run
  # still reported green — jcttech/trading#200. The D1 fast-lane
  # (jcttech/trading#185 §D1) was always a PR-only optimisation; a push
  # to the default branch is the canonical ground-truth build and is no
  # longer eligible for it.
  changes:
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # v3: the cargo-tests plan (see the `cargo-tests plan` step).
      cargo-tests-lanes: ${{ steps.cargo-tests-plan.outputs.lanes }}
      cargo-tests-archive: ${{ steps.cargo-tests-plan.outputs.archive }}
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build filter config
        id: build-filter
        run: |
          # Convert newline-separated paths to YAML list format
          PATHS=$(echo "${{ inputs.code-paths }}" | sed '/^$/d' | sed 's/^/      - /')
          echo "filters<<EOF" >> $GITHUB_OUTPUT
          echo "code:" >> $GITHUB_OUTPUT
          echo "$PATHS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ steps.build-filter.outputs.filters }}

      # ── cargo-tests: the lane gates and the build-once plan (v3) ─────
      # Each lane's own `code-paths`, evaluated here once with the rules
      # `cargo-tests.yml` has always applied (pull requests only; a filter
      # with no verdict runs the lane). The archive job and the lanes
      # consume only these verdicts: there is no separate build filter.
      - name: cargo-tests lane filters
        id: lane-filter-config
        if: inputs.enable-cargo-tests && github.event_name == 'pull_request'
        shell: bash
        env:
          CT_JSON: ${{ inputs.cargo-tests }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "jq not found; the plan will fall back to v2 behaviour"; exit 0; }
          filters=$(jq -r '
            to_entries[]
            | select((.value | type) == "object" and ((.value["code-paths"] // "") | tostring | length) > 0)
            | "lane_\(.key):", ((.value["code-paths"] | tostring) | split("\n")[] | select(length > 0) | "  - " + @json)
          ' <<<"$CT_JSON" 2>/dev/null || true)
          [ -z "$filters" ] && exit 0
          {
            echo "filters<<CARGO_TESTS_EOF"
            printf '%s\n' "$filters"
            echo "CARGO_TESTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: cargo-tests lane path filters
        id: lane-filter
        if: steps.lane-filter-config.outputs.filters != ''
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.lane-filter-config.outputs.filters }}

      - name: cargo-tests plan
        id: cargo-tests-plan
        if: inputs.enable-cargo-tests
        shell: bash
        env:
          CT_JSON: ${{ inputs.cargo-tests }}
          CT_BUILD_ONCE: ${{ inputs.cargo-tests-build-once }}
          CT_MANIFEST: ${{ inputs.cargo-tests-manifest-path }}
          CT_BUILD_JOBS: ${{ inputs.cargo-tests-build-jobs }}
          CT_BUILD_ENV: ${{ inputs.cargo-tests-build-env }}
          CT_BUILD_WRAPPER: ${{ inputs.cargo-tests-build-wrapper }}
          CT_FEATURE_CHECK: ${{ inputs.cargo-tests-feature-check }}
          HASH_SEED: ${{ inputs.container-image }} ${{ inputs.rust-version }} ${{ inputs.tag-prefix }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LANE_FILTER_OUTCOME: ${{ steps.lane-filter.outcome }}
          LANE_MATCHED: ${{ steps.lane-filter.outputs.changes }}
        run: |
          set -euo pipefail -f
          # The cargo-tests plan: which lanes run, which run from the shared
          # archive, and what the archive holds. Reads only the inputs and the
          # per-lane path-filter verdicts above. Writes `lanes` (the matrix) and
          # `archive` (the archive job's work order) to $GITHUB_OUTPUT.
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          seterr() { if [ -z "$err" ]; then err="$1"; fi; }
          sq() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"; }

          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning title=cargo-tests::jq is not in the job image, so the pipeline can't plan build-once: every lane builds and tests in its own pod (v2 behaviour)."
            out lanes "$(printf '%s' "$CT_JSON" | tr '\n' ' ')"
            out archive '{"build":false}'
            exit 0
          fi
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$CT_JSON"; then
            echo "::error title=cargo-tests::the cargo-tests input is not a JSON array"
            exit 1
          fi

          # Top-level build settings: validate once.
          if [ -n "$CT_FEATURE_CHECK" ] && ! printf '%s' "$CT_FEATURE_CHECK" | grep -qxE 'report|strict|off'; then
            echo "::error title=cargo-tests::cargo-tests-feature-check must be report, strict or off (got '$CT_FEATURE_CHECK')"
            exit 1
          fi
          build_exports=""
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            k="${line%%=*}"; v="${line#*=}"
            if [ "$k" = "$line" ] || ! printf '%s' "$k" | grep -qxE '[A-Za-z_][A-Za-z0-9_]*'; then
              echo "::error title=cargo-tests::cargo-tests-build-env: '$line' is not KEY=VALUE"
              exit 1
            fi
            build_exports+="export $k=$(sq "$v")"$'\n'
          done <<<"$CT_BUILD_ENV"
          manifest="\"\$GITHUB_WORKSPACE\"/$(sq "$CT_MANIFEST")"

          nextest=false
          # cargo finds subcommands on PATH and in $CARGO_HOME/bin.
          if command -v cargo-nextest >/dev/null 2>&1 || [ -x "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-nextest" ]; then
            nextest=true
          fi

          # The per-lane path filters (pull requests only; any doubt runs the lane).
          matched='[]'; filter_ok=false
          if [ "$LANE_FILTER_OUTCOME" = success ] && jq -e 'type == "array"' >/dev/null 2>&1 <<<"${LANE_MATCHED:-}"; then
            matched="$LANE_MATCHED"; filter_ok=true
          fi

          n=$(jq 'length' <<<"$CT_JSON")
          lanes='[]'; names=' '
          declare -a L_NAME L_MODE L_WHY L_RUN L_RUNWHY L_PKGS L_FEATS L_DOC L_CMD L_ACMD L_ENTRY
          cands=()
          for ((i = 0; i < n; i++)); do
            e=$(jq -c ".[$i]" <<<"$CT_JSON")
            f() { jq -r --arg k "$1" 'if (type == "object") and has($k) and .[$k] != null then (.[$k] | tostring) else "" end' <<<"$e"; }
            has() { jq -e --arg k "$1" '(type == "object") and has($k)' >/dev/null <<<"$e"; }
            name=$(f name); cmd=$(f command); err=""
            if [ -z "$name" ]; then name="entry $i"; err="the entry has no name"; fi
            case "$names" in *" $name "*) err="two entries are named '$name'" ;; esac
            names+="$name "

            # Triggered? v2's lane gate, evaluated here once.
            cp=$(f code-paths)
            if [ "$EVENT_NAME" = push ] && [ -n "$DEFAULT_BRANCH" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
              run=true; runwhy="push to the default branch ($DEFAULT_BRANCH); D1 fast-lane bypassed"
            elif [ "$EVENT_NAME" != pull_request ]; then
              run=true; runwhy="event '$EVENT_NAME' is not a pull_request; D1 fast-lane does not apply"
            elif [ -z "$cp" ]; then
              run=true; runwhy="no code-paths filter configured"
            elif [ "$filter_ok" != true ]; then
              run=true; runwhy="path filter reached no verdict; running anyway (fail-open)"
            elif jq -e --arg k "lane_$i" 'index($k) != null' >/dev/null <<<"$matched"; then
              run=true; runwhy="code-paths matched the pull-request diff"
            else
              run=false; runwhy="no file in the pull-request diff matched code-paths"
            fi

            pkgs=""; feats=""; doc=false; acmd=""; structured=false; once=true
            if has packages; then
              structured=true
              pkgs=$(f packages | tr '\n\t,' '   ' | awk '{$1=$1};1')
              feats=$(f features | tr '\n\t' '  ' | awk '{$1=$1};1')
              profile=$(f profile); filter=$(f filter); nargs=$(f nextest-args | tr '\n' ' ' | awk '{$1=$1};1')
              setup=$(f setup); twrap=$(f test-wrapper)
              [ -z "$pkgs" ] && seterr "packages is empty"
              for p in $pkgs; do
                printf '%s' "$p" | grep -qxE '[A-Za-z0-9_][A-Za-z0-9_.@:+-]*' || seterr "'$p' is not a package name"
              done
              case "$(f doctests)" in true) doc=true ;; ''|false) ;; *) seterr "doctests must be 'true' or 'false'" ;; esac
              case "$(f build-once)" in false) once=false ;; ''|true) ;; *) seterr "build-once must be 'true' or 'false'" ;; esac
              [ -n "$profile" ] && ! printf '%s' "$profile" | grep -qxE '[A-Za-z0-9_.-]+' && seterr "'$profile' is not a nextest profile name"
              for t in $nargs; do
                case "$t" in
                  -p*|--package|--package=*|--workspace|--all|--exclude|--exclude=*) seterr "nextest-args: '$t' — list the lane's packages in 'packages'" ;;
                  -E*|--filterset|--filterset=*|--filter-expr|--filter-expr=*) seterr "nextest-args: '$t' — put the filterset in 'filter'" ;;
                  -F*|--features|--features=*|--all-features|--no-default-features) seterr "nextest-args: '$t' — use 'features' (a lane that needs --all-features/--no-default-features sets build-once: 'false' and a 'command')" ;;
                  -P*|--profile|--profile=*) seterr "nextest-args: '$t' — use 'profile'" ;;
                  --manifest-path|--manifest-path=*|--archive-file|--archive-file=*|--cargo-metadata*|--binaries-metadata*|--workspace-remap*|--target-dir-remap*|--extract-to*)
                    seterr "nextest-args: '$t' is set by the pipeline" ;;
                esac
              done
              if has build-jobs; then jobs=$(f build-jobs); else jobs="$CT_BUILD_JOBS"; fi
              [ -n "$jobs" ] && ! printf '%s' "$jobs" | grep -qxE '[1-9][0-9]*' && seterr "build-jobs must be a positive integer or ''"

              sel="--manifest-path $manifest"
              for p in $pkgs; do sel+=" -p $(sq "$p")"; done
              [ -n "$feats" ] && sel+=" --features $(sq "$feats")"
              prof=""; [ -n "$profile" ] && prof=" --profile $(sq "$profile")"

              # The command the lane runs when it builds itself.
              if [ -z "$cmd" ]; then
                [ -n "$jobs" ] && cmd+="export CARGO_BUILD_JOBS=$jobs"$'\n'
                cmd+="$build_exports"
                [ -n "$setup" ] && cmd+="$setup"$'\n'
                [ -n "$CT_BUILD_WRAPPER" ] && cmd+="$CT_BUILD_WRAPPER cargo nextest run --no-run $sel$prof"$'\n'
                cmd+="${twrap:+$twrap }cargo nextest run $sel$prof${filter:+ -E $(sq "$filter")}${nargs:+ $nargs}"$'\n'
                [ "$doc" = true ] && cmd+="cargo test --doc $sel"$'\n'
              fi

              # The command the lane runs from the archive: its partition only.
              expr=""
              for p in $pkgs; do expr+="${expr:+ | }package(=$p)"; done
              [ -n "$filter" ] && expr="($expr) & ($filter)"
              [ -n "$setup" ] && acmd+="$setup"$'\n'
              acmd+="${twrap:+$twrap }cargo nextest run"
              acmd+=" --binaries-metadata \"\$CARGO_TESTS_TARGET_DIR/nextest/binaries-metadata.json\""
              acmd+=" --cargo-metadata \"\$CARGO_TESTS_TARGET_DIR/nextest/cargo-metadata.json\""
              acmd+=" --target-dir-remap \"\$CARGO_TESTS_TARGET_DIR\" --workspace-remap \"\$CARGO_TESTS_WORKSPACE\""
              acmd+="$prof -E $(sq "$expr")${nargs:+ $nargs}"$'\n'
            fi
            [ -z "$err" ] && [ -z "$cmd" ] && err="the entry has neither 'command' nor 'packages'"

            if [ -n "$err" ]; then
              mode=invalid; why="$err"; run=true; runwhy="the entry is invalid"
              cmd="echo $(sq "::error title=cargo-tests ($name)::$err"); exit 1"; acmd=""
            elif [ "$run" != true ]; then
              mode=skip; why="not triggered"
            elif [ "$structured" != true ]; then
              mode=lane; why="no 'packages': the pipeline can't tell what a free-form command builds"
            elif [ "$CT_BUILD_ONCE" != true ]; then
              mode=lane; why="cargo-tests-build-once: false"
            elif [ "$once" != true ]; then
              mode=lane; why="the entry sets build-once: 'false'"
            elif [ "$nextest" != true ]; then
              mode=lane; why="cargo-nextest is not in the job image"
            else
              mode=archive; why="runs its partition of the shared archive"; cands+=("$i")
            fi
            L_NAME[i]="$name"; L_MODE[i]="$mode"; L_WHY[i]="$why"; L_RUN[i]="$run"; L_RUNWHY[i]="$runwhy"
            L_PKGS[i]="$pkgs"; L_FEATS[i]="$feats"; L_DOC[i]="$doc"; L_CMD[i]="$cmd"; L_ACMD[i]="$acmd"; L_ENTRY[i]="$e"
          done

          if [ "${#cands[@]}" -eq 1 ]; then
            i="${cands[0]}"; L_MODE[i]=lane; L_WHY[i]="the only lane that would run from an archive: nothing to share"; cands=()
          fi

          # The archive: the union of the triggered archive lanes' packages and features.
          apkgs=""; afeats=""; adoc=false; alanes='[]'; lanepk='{}'; lanefeat='{}'; doclanes='{}'
          for i in "${cands[@]}"; do
            for p in ${L_PKGS[i]}; do case " $apkgs " in *" $p "*) ;; *) apkgs+="${apkgs:+ }$p" ;; esac; done
            for x in ${L_FEATS[i]//,/ }; do case " $afeats " in *" $x "*) ;; *) afeats+="${afeats:+ }$x" ;; esac; done
            alanes=$(jq -c --arg n "${L_NAME[i]}" '. + [$n]' <<<"$alanes")
            lanepk=$(jq -c --arg n "${L_NAME[i]}" --arg v "${L_PKGS[i]}" '. + {($n): $v}' <<<"$lanepk")
            lanefeat=$(jq -c --arg n "${L_NAME[i]}" --arg v "${L_FEATS[i]}" '. + {($n): $v}' <<<"$lanefeat")
            if [ "${L_DOC[i]}" = true ]; then
              adoc=true; doclanes=$(jq -c --arg n "${L_NAME[i]}" --arg v "${L_PKGS[i]}" '. + {($n): $v}' <<<"$doclanes")
            fi
          done
          build=false; [ "${#cands[@]}" -ge 2 ] && build=true
          artifact="cargo-tests-archive-$(printf '%s\n' "$CT_JSON" "$CT_MANIFEST" "$CT_BUILD_ENV" "$CT_BUILD_JOBS" "$CT_BUILD_WRAPPER" "$HASH_SEED" | sha256sum | cut -c1-12)"

          for ((i = 0; i < n; i++)); do
            lanes=$(jq -c \
              --argjson e "${L_ENTRY[i]}" --arg name "${L_NAME[i]}" --arg mode "${L_MODE[i]}" --arg why "${L_WHY[i]}" \
              --arg run "${L_RUN[i]}" --arg runwhy "${L_RUNWHY[i]}" --arg cmd "${L_CMD[i]}" --arg acmd "${L_ACMD[i]}" \
              --arg doc "${L_DOC[i]}" \
              '. + [{
                 "name": $name,
                 "with-postgres": (($e["with-postgres"] // "false") | tostring),
                 "postgres-image": (($e["postgres-image"] // "postgres:18") | tostring),
                 "pre-test-script": (($e["pre-test-script"] // "") | tostring),
                 "init-sql": (($e["init-sql"] // "") | tostring),
                 "code-paths": (($e["code-paths"] // "") | tostring),
                 "working-directory": (($e["working-directory"] // ".") | tostring),
                 "run": $run, "run-reason": $runwhy, "mode": $mode, "mode-reason": $why,
                 "command": $cmd, "archive-command": $acmd, "doctests": $doc
               }]' <<<"$lanes")
          done
          archive=$(jq -nc --argjson build "$build" --arg artifact "$artifact" --arg pkgs "$apkgs" --arg feats "$afeats" \
            --argjson doc "$adoc" --argjson lanes "$alanes" --argjson lanepk "$lanepk" --argjson lanefeat "$lanefeat" \
            --argjson doclanes "$doclanes" \
            '{build: $build, artifact: $artifact, packages: $pkgs, features: $feats, doctests: $doc,
              lanes: $lanes, "lane-packages": $lanepk, "lane-features": $lanefeat, "doctest-lanes": $doclanes}')
          out lanes "$lanes"
          out archive "$archive"

          {
            echo "## cargo-tests plan"
            echo
            if [ "$build" = true ]; then
              echo "Build once: \`cargo-tests-archive\` archives \`${apkgs}\`${afeats:+ (features \`$afeats\`)} for ${#cands[@]} lanes."
            else
              echo "No shared archive in this run: every lane that runs builds its own test binaries."
            fi
            echo
            echo "| Lane | Runs | Why | How | Why |"
            echo "|---|---|---|---|---|"
            for ((i = 0; i < n; i++)); do
              echo "| ${L_NAME[i]} | ${L_RUN[i]} | ${L_RUNWHY[i]} | ${L_MODE[i]} | ${L_WHY[i]} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: >-
      inputs.enable-build &&
      (startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.code == 'true')
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: jcttech/.github/.github/actions/rust-setup@v1
        with:
          rust-version: ${{ inputs.rust-version }}

      - name: Configure cargo for private git deps
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "PRIVATE_REPO_TOKEN not set; cargo will use anonymous git access only"
            exit 0
          fi
          git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured private git auth via PRIVATE_REPO_TOKEN for cargo fetch"

      - name: Extract version from tag
        if: startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix))
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREFIX="${{ inputs.tag-prefix }}"
          VERSION="${TAG#${PREFIX}v}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Enable sccache recache
        if: inputs.sccache-recache
        run: echo "SCCACHE_RECACHE=true" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Stage binary to shared cache
        if: inputs.binary-name != '' && inputs.container-image != '' && (inputs.enable-docker || inputs.enable-release)
        run: |
          mkdir -p /cache/workflow/${{ github.run_id }}
          cp target/release/${{ inputs.binary-name }} /cache/workflow/${{ github.run_id }}/
          chmod +x /cache/workflow/${{ github.run_id }}/${{ inputs.binary-name }}

      - name: Upload binary artifact
        if: inputs.binary-name != '' && inputs.container-image == '' && (inputs.enable-docker || inputs.enable-release)
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: target/release/${{ inputs.binary-name }}

  # ── cargo-tests: build once (v3) ─────────────────────────────────────
  # The test binaries of every TRIGGERED lane that runs from the archive
  # (the `changes` job's plan: two or more such lanes, else this job is
  # skipped), built once with `cargo nextest archive`, uploaded as an
  # artifact of the run, then the doc tests against the same build.
  # Same job-level gate as the lanes below. The check is
  # `cargo-tests-archive`, which can't collide with a lane's
  # `cargo-tests (<name>) / <name>`.
  cargo-tests-archive:
    name: cargo-tests-archive
    needs: changes
    if: >-
      inputs.enable-cargo-tests &&
      fromJson(needs.changes.outputs.cargo-tests-archive || '{"build":false}').build &&
      (startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch))
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    outputs:
      status: ${{ steps.ready.outputs.status || steps.features.outputs.status }}
      excluded: ${{ steps.features.outputs.excluded }}
      lane-archives: ${{ steps.archive.outputs.lane-archives }}
      target-dir: ${{ steps.archive.outputs.target-dir }}
      workspace-root: ${{ steps.archive.outputs.workspace-root }}
      github-workspace: ${{ steps.archive.outputs.github-workspace }}
      doctests: ${{ steps.doctests.outputs.doctests }}
    env:
      ARCHIVE_PLAN: ${{ needs.changes.outputs.cargo-tests-archive }}
      CT_MANIFEST: ${{ inputs.cargo-tests-manifest-path }}
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Rust
        uses: jcttech/.github/.github/actions/rust-setup@v1
        with:
          rust-version: ${{ inputs.rust-version }}

      - name: Configure cargo for private git deps
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "PRIVATE_REPO_TOKEN not set; cargo will use anonymous git access only"
            exit 0
          fi
          git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured private git auth via PRIVATE_REPO_TOKEN for cargo fetch"

      - name: Enable sccache recache
        if: inputs.sccache-recache
        run: echo "SCCACHE_RECACHE=true" >> "$GITHUB_ENV"

      - name: Build environment
        shell: bash
        env:
          CT_BUILD_JOBS: ${{ inputs.cargo-tests-build-jobs }}
          CT_BUILD_ENV: ${{ inputs.cargo-tests-build-env }}
        run: |
          set -euo pipefail
          # Validated by the plan: KEY=VALUE lines.
          {
            [ -n "$CT_BUILD_JOBS" ] && echo "CARGO_BUILD_JOBS=$CT_BUILD_JOBS"
            printf '%s\n' "$CT_BUILD_ENV" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' -e '/^#/d'
          } | tee -a "$GITHUB_ENV"

      - name: Feature unification check
        id: features
        shell: bash
        env:
          CT_FEATURE_CHECK: ${{ inputs.cargo-tests-feature-check }}
        run: |
          set -uo pipefail -f
          # Advisory: no failure in here may fail the build. Without -e, a
          # failed resolution or comparison skips the check (`ok=false`) and
          # the archive is shared as planned. C collation, so `sort` and
          # `join` agree on the order whatever the image's locale.
          export LC_ALL=C
          # Which lanes share the archive, after the feature-unification check.
          # Cargo unifies features across every package of one build, so a lane's
          # crates can compile with more features in the union than in a build of
          # that lane alone. `report` lists the workspace crates that differ;
          # `strict` gives those lanes their own build (until the rest agree).
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          manifest="$GITHUB_WORKSPACE/$CT_MANIFEST"
          mapfile -t lanes < <(jq -r '.lanes[]' <<<"$ARCHIVE_PLAN")
          planned=("${lanes[@]}")
          lpk() { jq -r --arg n "$1" '.["lane-packages"][$n]' <<<"$ARCHIVE_PLAN"; }
          lft() { jq -r --arg n "$1" '.["lane-features"][$n] // ""' <<<"$ARCHIVE_PLAN"; }
          union() { # lane names -> "packages|features"
            local p="" f="" n x
            for n in "$@"; do
              for x in $(lpk "$n"); do case " $p " in *" $x "*) ;; *) p+="${p:+ }$x" ;; esac; done
              for x in $(lft "$n" | tr ',' ' '); do case " $f " in *" $x "*) ;; *) f+="${f:+ }$x" ;; esac; done
            done
            printf '%s|%s' "$p" "$f"
          }
          # One line per package node: "<id>|<features>", features of every build
          # of it (host/target) joined with ';'.
          resolve() { # packages features
            local a=() p
            for p in $1; do a+=(-p "$p"); done
            [ -n "$2" ] && a+=(--features "$2")
            cargo tree --manifest-path "$manifest" -e normal,build,dev --prefix none -f '{p}|{f}' "${a[@]}" \
              | sed 's/ (\*)$//' | sort -u \
              | awk -F'|' '$1 != "" { k = $1; v[k] = (k in v) ? v[k] ";" $2 : $2 } END { for (k in v) print k "|" v[k] }' | sort -t'|' -k1,1
          }

          excluded=()
          declare -A diffs_all diffs_ws
          if [ "$CT_FEATURE_CHECK" != off ] && [ "${#lanes[@]}" -ge 2 ]; then
            ok=true
            while :; do
              u=$(union "${lanes[@]}"); upk="${u%%|*}"; uft="${u#*|}"
              if ! U=$(resolve "$upk" "$uft"); then ok=false; break; fi
              changed=false; keep=()
              for n in "${lanes[@]}"; do
                if ! A=$(resolve "$(lpk "$n")" "$(lft "$n")"); then ok=false; break 2; fi
                if ! d=$(join -t'|' -j1 <(printf '%s\n' "$A") <(printf '%s\n' "$U") | awk -F'|' '$2 != $3 { print $1 "|" $2 "|" $3 }'); then
                  ok=false; break 2
                fi
                diffs_all[$n]=$(printf '%s' "$d" | grep -c . || true)
                diffs_ws[$n]=$(printf '%s\n' "$d" | grep -F "($GITHUB_WORKSPACE/" \
                  | sed -E "s#^([^ ]+) [^|]*\|([^|]*)\|(.*)\$#\1: alone [\2] / shared [\3]#; s/\[;/[/g; s/;\]/]/g" || true)
                if [ "$CT_FEATURE_CHECK" = strict ] && [ -n "${diffs_ws[$n]}" ]; then
                  excluded+=("$n"); changed=true
                else
                  keep+=("$n")
                fi
              done
              lanes=("${keep[@]}")
              { [ "$changed" = true ] && [ "${#lanes[@]}" -ge 2 ]; } || break
            done
            if [ "$ok" != true ]; then
              echo "::warning title=cargo-tests::the feature-unification check could not run (cargo tree or the comparison failed), so the archive is shared as planned"
              lanes=("${planned[@]}"); excluded=()
            fi
          fi
          if [ "${#lanes[@]}" -lt 2 ]; then
            excluded+=("${lanes[@]}"); lanes=()
          fi
          u=$(union "${lanes[@]}"); upk="${u%%|*}"; uft="${u#*|}"
          out packages "$upk"
          out features "$uft"
          if [ "${#lanes[@]}" -ge 2 ]; then out build true; else out build false; out status none; fi
          out lanes "$(printf '%s\n' "${lanes[@]}" | jq -R . | jq -sc 'map(select(length > 0))')"
          out excluded "$(printf '%s\n' "${excluded[@]}" | jq -R . | jq -sc 'map(select(length > 0))')"

          {
            echo "## cargo-tests: feature unification (\`cargo-tests-feature-check: $CT_FEATURE_CHECK\`)"
            echo
            if [ "$CT_FEATURE_CHECK" = off ]; then
              echo "Not checked."
            else
              echo "Cargo unifies features across the packages of one build. Per lane: the crates that compile with other features in the shared archive than in a build of that lane alone."
              echo
              echo "| Lane | Crates that differ | Workspace crates that differ | Shares the archive |"
              echo "|---|---|---|---|"
              for n in "${planned[@]}"; do
                ws="${diffs_ws[$n]:-}"; ws="${ws//$'\n'/<br>}"
                case " ${excluded[*]} " in *" $n "*) s=no ;; *) s=yes ;; esac
                echo "| $n | ${diffs_all[$n]:-?} | ${ws:-none} | $s |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One build (the union's -p/--features selection, so every lane's
      # crates are compiled exactly once and agree on features), then one
      # archive per lane holding only its packages' binaries, so a lane
      # downloads and extracts its own partition, not everyone's (trading
      # run 43058297492: one 9.2 GB archive pulled by five lanes). The
      # first `cargo nextest archive` builds everything; the rest only
      # re-archive (cargo has nothing left to do).
      - name: Build the test archives
        id: archive
        if: steps.features.outputs.build == 'true'
        shell: bash
        env:
          ARTIFACT: ${{ fromJson(needs.changes.outputs.cargo-tests-archive).artifact }}
          PKGS: ${{ steps.features.outputs.packages }}
          FEATS: ${{ steps.features.outputs.features }}
          ARCHIVE_LANES: ${{ steps.features.outputs.lanes }}
          CT_BUILD_WRAPPER: ${{ inputs.cargo-tests-build-wrapper }}
        run: |
          set -euo pipefail -f
          slots=12   # upload steps below; lanes beyond that share a slot's artifact
          manifest="$GITHUB_WORKSPACE/$CT_MANIFEST"
          dir="$RUNNER_TEMP/cargo-tests-archive"; rm -rf "$dir"; mkdir -p "$dir"
          a=(); for p in $PKGS; do a+=(-p "$p"); done
          [ -n "$FEATS" ] && a+=(--features "$FEATS")
          mapfile -t lanes < <(jq -r '.[]' <<<"$ARCHIVE_LANES")
          lanepk() { jq -r --arg n "$1" '.["lane-packages"][$n]' <<<"$ARCHIVE_PLAN"; }
          archives='{}'; rows=""; total=0; build_secs=0
          start=$(date +%s)
          for k in "${!lanes[@]}"; do
            n="${lanes[$k]}"; slot=$(( k % slots )); mkdir -p "$dir/slot-$slot"
            file="lane-$k.tar.zst"
            expr=""; for p in $(lanepk "$n"); do expr+="${expr:+ | }package(=$p)"; done
            set -- cargo nextest archive --manifest-path "$manifest" "${a[@]}" -E "$expr" --archive-file "$dir/slot-$slot/$file"
            t0=$(date +%s)
            if [ "$k" -eq 0 ]; then
              echo "Building once for ${#lanes[@]} lanes: ${CT_BUILD_WRAPPER:+$CT_BUILD_WRAPPER }$* (CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-unset})"
              if [ -n "$CT_BUILD_WRAPPER" ]; then eval "$CT_BUILD_WRAPPER \"\$@\""; else "$@"; fi
              build_secs=$(( $(date +%s) - t0 ))
            else
              echo "Archiving lane $n: $*"
              "$@"
            fi
            size=$(stat -c %s "$dir/slot-$slot/$file"); total=$(( total + size ))
            echo "slot-$slot=true" >> "$GITHUB_OUTPUT"
            archives=$(jq -c --arg n "$n" --arg a "$ARTIFACT-$slot" --arg f "$file" '. + {($n): {artifact: $a, file: $f}}' <<<"$archives")
            rows+="| $n | \`$expr\` | $(awk -v b="$size" 'BEGIN { printf "%.0f MiB", b / 1048576 }') | $(( $(date +%s) - t0 ))s |"$'\n'
          done
          secs=$(( $(date +%s) - start ))
          meta=$(cargo metadata --no-deps --format-version 1 --manifest-path "$manifest")
          echo "CARGO_TESTS_UPLOAD_T0=$(date +%s)" >> "$GITHUB_ENV"
          {
            echo "dir=$dir"
            echo "total-bytes=$total"
            echo "lane-archives=$archives"
            echo "target-dir=$(jq -r .target_directory <<<"$meta")"
            echo "workspace-root=$(jq -r .workspace_root <<<"$meta")"
            echo "github-workspace=$GITHUB_WORKSPACE"
          } >> "$GITHUB_OUTPUT"
          mib() { awk -v b="$1" 'BEGIN { printf "%.0f MiB", b / 1048576 }'; }
          {
            echo "## cargo-tests archive"
            echo
            echo "Built once: \`$PKGS\`${FEATS:+, features \`$FEATS\`}; CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-unset}; build $((build_secs / 60))m$((build_secs % 60))s, build + archives $((secs / 60))m$((secs % 60))s, $(mib "$total") in all."
            echo
            echo "| Lane | Archived binaries | Archive | Time |"
