      - name: Upload the test archive (slot 3)
        if: steps.archive.outputs.slot-3 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJson(needs.changes.outputs.cargo-tests-archive).artifact }}-3
          path: ${{ steps.archive.outputs.dir }}/slot-3
