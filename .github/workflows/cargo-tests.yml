# Cargo Tests — reusable workflow
#
# Runs `cargo test` with a caller-supplied command, optional Postgres
# sidecar, optional pre-test bootstrap, and optional path-filter gating.
# The status check name is taken from the `name` input so each call shows
# up as a semantic split (e.g. `Unit`, `Integration`, `Server`, `Smoke`,
# `Storage`) rather than the legacy generic "Database Tests".
#
# Designed to be **matrix-dispatched** from `rust-pipeline.yml`'s
# `enable-cargo-tests` + `cargo-tests` inputs — each JSON entry the
# caller provides becomes one invocation of this workflow, running in
# parallel with sibling entries. A caller can also use this workflow
# directly without going through `rust-pipeline.yml`.
#
# ## Single-job design (revised)
#
# The first cut split this into two sibling jobs (`run-with-postgres`,
# `run-without-postgres`) gated on the `with-postgres` input — needed
# because GitHub Actions does not support conditional `services:`
# blocks. That worked but produced an ugly status check for the skipped
# sibling: the matrix-rendered display name was the literal expression
# `inputs.name` (skipped jobs don't run the name-evaluation phase).
#
# This revision collapses to a single job. The Postgres service is
# always declared and starts unconditionally; the DB-touching steps
# (psql install, init-sql, pre-test-script, DATABASE_URL on the test
# command) are individually gated on `inputs.with-postgres == 'true'`.
# Cost: ~10s of wasted Postgres startup per unit-test run (no DB).
# Benefit: one job per matrix entry, one semantic status check.
#
# ## Caller-relative path resolution
#
# `pre-test-script`, `init-sql`, and `working-directory` are interpreted
# relative to the CALLER's repo checkout — these files live in the
# consuming repo, not in `jcttech/.github`. This matches the convention
# in the sibling `rust-database-tests.yml`.
#
# ## D1 fast-lane and the push-to-default-branch bypass
#
# The optional `code-paths` input is the standardised docs-only skip
# mechanism (Spec jcttech/trading#185 §D1) shared with the sibling
# reusables. It is a PULL-REQUEST-ONLY optimisation.
#
# **Behaviour change (jcttech/trading#200):** a `push` to the repository's
# DEFAULT BRANCH bypasses the fast-lane outright and always runs the real
# test command — a default-branch push is the canonical ground-truth
# build. The gate also FAILS OPEN when the filter reaches no verdict
# (skipped step, action error, mangled shell comparison — the failure mode
# behind #200 and PR #20), and any legitimate path-gated skip is written to
# `$GITHUB_STEP_SUMMARY` so it is never a silent green. PR behaviour is
# otherwise unchanged.
#
# ## Running from a shared test archive (v3)
#
# Under `rust-pipeline.yml@v3` a lane can run from the run's nextest
# archive instead of building: the pipeline passes `archive-artifact`,
# `archive-command` (the lane's partition) and the build's paths, plus
# its own gate verdict (`should-run`) and doc-test result. The lane then
# downloads and extracts the archive and runs the partition; `command`
# remains the fallback when the archive is gone. Called directly, with
# none of those inputs, this workflow behaves exactly as v2.
#
# ## Backwards / forwards compat
#
# Adding fields to the matrix entry JSON is additive — missing keys
# evaluate to empty strings, which are then defaulted on the input
# side here. Removing or renaming a field is a breaking change and
# would warrant a new tag (e.g. `@v3`).

name: Cargo Tests

on:
  workflow_call:
    inputs:
      name:
        type: string
        description: |
          Display name for this test split (e.g. "Unit", "Integration",
          "Server"). Becomes the job name in the Actions UI and the
          status check label on PRs.
      command:
        type: string
        description: |
          The cargo test command to run. Examples:
            cargo test --workspace
            cargo test -p foo -p bar --manifest-path crate/Cargo.toml
            cargo nextest run --workspace
      with-postgres:
        type: string
        default: 'false'
        description: |
          When 'true', the test step's environment includes
          DATABASE_URL pointing at the in-job Postgres service, plus
          the init-sql / pre-test-script bootstrap steps fire. When
          anything else (incl. empty string for matrix entries that
          omit the field), those DB-touching steps are skipped. The
          Postgres service still starts (~10s overhead) regardless —
          see the "Single-job design" comment at the top of this file.
      postgres-image:
        type: string
        default: 'postgres:18'
        description: 'Docker image for the Postgres service.'
      pre-test-script:
        type: string
        default: ''
        description: |
          Caller-relative path to a bash script run before the test
          command. Typical use: schema bootstrap (e.g. `make
          schema-apply` + a sqlx migrator). Receives the same DB env
          as the test step. Only honoured when with-postgres="true".
      init-sql:
        type: string
        default: ''
        description: |
          Caller-relative path to a SQL script run via `psql` before
          the pre-test-script. Only honoured when with-postgres="true".
      code-paths:
        type: string
        default: ''
        description: |
          Optional newline-separated glob list. When set and the event
          is `pull_request`, `dorny/paths-filter@v4` decides whether
          this entry runs; an empty match-set skips every subsequent
          step (job exits green in <30 s). Empty default = always run.
          Push events always run regardless.
      working-directory:
        type: string
        default: '.'
        description: 'cwd for the test command (and the pre-test-script).'
      runner:
        type: string
        default: 'github-arc-github-arc-runner-set'
        description: 'Runner label.'
      container-image:
        type: string
        default: 'ghcr.io/jcttech/devcontainer-rust:latest'
        description: |
          Container image for the job pod (ARC K8s mode). Empty string
          runs directly on the runner host.
      rust-version:
        type: string
        default: 'stable'
        description: 'Rust toolchain channel forwarded to rust-setup@v1.'
      pg-host:
        type: string
        default: 'localhost'
        description: |
          PostgreSQL service hostname. Use `localhost` for ARC K8s and
          GHA runners; the service name for Docker-mode runners.
      # ── Set by rust-pipeline.yml@v3 (build once, run everywhere) ──────
      # A direct caller leaves these empty and gets v2's behaviour exactly.
      should-run:
        type: string
        default: ''
        description: |
          'true' / 'false': the lane's gate, already decided by
          rust-pipeline's `changes` job from this lane's `code-paths` (same
          rules as below). Empty: this workflow evaluates `code-paths`
          itself.
      should-run-reason:
        type: string
        default: ''
        description: 'Why, when `should-run` is set (shown in the log and the skip summary).'
      archive-artifact:
        type: string
        default: ''
        description: |
          Name of the run's artifact holding the nextest archive this lane
          runs from. Empty: the lane builds its own test binaries with
          `command`, as in v2.
      archive-status:
        type: string
        default: ''
        description: |
          The archive job's state: 'ready' once the archive is uploaded.
          Anything else with `archive-artifact` set fails the lane (the
          shared build failed; nothing to run).
      archive-command:
        type: string
        default: ''
        description: |
          What the lane runs from the archive (its partition). Gets
          `CARGO_TESTS_TARGET_DIR` / `CARGO_TESTS_WORKSPACE` in its env.
      archive-target-dir:
        type: string
        default: ''
        description: 'Absolute target directory of the build (the archive is extracted to the same path).'
      archive-workspace-root:
        type: string
        default: ''
        description: 'Absolute workspace root of the build (`--workspace-remap`).'
      archive-github-workspace:
        type: string
        default: ''
        description: "The build job's `$GITHUB_WORKSPACE`, to map its paths onto this job's."
      doctests-verdict:
        type: string
        default: ''
        description: |
          This lane's doc-test result from the archive job ('passed' /
          'failed'), when the lane asked for doc tests. Doc tests aren't in
          a nextest archive, so they run once against the archive's build.

jobs:
  run:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image || null }}
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_HOST: ${{ inputs.pg-host }}
    steps:
      - uses: actions/checkout@v5

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build paths-filter input
        id: build-filter
        if: inputs.code-paths != '' && github.event_name == 'pull_request' && inputs.should-run == ''
        run: |
          PATHS=$(echo "${{ inputs.code-paths }}" | sed '/^$/d' | sed 's/^/      - /')
          {
            echo "filters<<EOF"
            echo "relevant:"
            echo "$PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute should-run from code-paths
        id: changes
        if: inputs.code-paths != '' && github.event_name == 'pull_request' && inputs.should-run == ''
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.build-filter.outputs.filters }}

      - name: Decide should-run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CODE_PATHS: ${{ inputs.code-paths }}
          FILTER_RESULT: ${{ steps.changes.outputs.relevant }}
          SHOULD_RUN: ${{ inputs.should-run }}
          SHOULD_RUN_REASON: ${{ inputs.should-run-reason }}
        run: |
          # POSIX sh only -- these images may not carry bash (see PR #20).
          #
          # The D1 fast-lane (jcttech/trading#185 D1) is a PULL-REQUEST-ONLY
          # optimisation. A push to the DEFAULT BRANCH is the canonical
          # ground-truth build, so it bypasses the path filter entirely and
          # always runs the real work -- jcttech/trading#200 option 2.
          #
          # Under rust-pipeline.yml@v3 the same rules were already applied
          # to this lane's code-paths in its `changes` job (the archive is
          # built for the lanes they triggered); that verdict is used as is.
          if [ "$SHOULD_RUN" = "true" ] || [ "$SHOULD_RUN" = "false" ]; then
            RUN="$SHOULD_RUN"
            REASON="$SHOULD_RUN_REASON"
            [ -n "$REASON" ] || REASON="decided by the changes job of rust-pipeline.yml"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$DEFAULT_BRANCH" ] \
             && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            RUN=true
            REASON="push to the default branch ($DEFAULT_BRANCH); D1 fast-lane bypassed"
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            RUN=true
            REASON="event '$EVENT_NAME' is not a pull_request; D1 fast-lane does not apply"
          elif [ -z "$CODE_PATHS" ]; then
            RUN=true
            REASON="no code-paths filter configured"
          elif [ "$FILTER_RESULT" = "true" ]; then
            RUN=true
            REASON="code-paths matched the pull-request diff"
          elif [ "$FILTER_RESULT" = "false" ]; then
            RUN=false
            REASON="no file in the pull-request diff matched code-paths"
          else
            # The filter reached no verdict: its step was skipped, the action
            # failed, or the shell mangled the gate (the exact failure mode
            # behind jcttech/trading#200 and PR #20). FAIL OPEN -- run the real
            # work rather than report a silent green.
            RUN=true
            REASON="path filter reached no verdict; running anyway (fail-open)"
          fi
          echo "should-run=$RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "should-run=$RUN ($REASON)"

      - name: Report path-gated skip
        if: steps.gate.outputs.should-run != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          {
            echo "### Skipped: Cargo Tests (path-gated)"
            echo
            echo "No build or test ran in this job -- it was gated off by the"
            echo "D1 code-paths fast-lane, not executed and passed."
            echo
            echo "Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        if: steps.gate.outputs.should-run == 'true'
        uses: jcttech/.github/.github/actions/rust-setup@v1
        with:
          rust-version: ${{ inputs.rust-version }}

      - name: Configure cargo for private git deps
        if: steps.gate.outputs.should-run == 'true'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "PRIVATE_REPO_TOKEN not set; cargo will use anonymous git access only"
            exit 0
          fi
          git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured private git auth via PRIVATE_REPO_TOKEN for cargo fetch"

      # ── Build once, run everywhere (rust-pipeline.yml@v3) ─────────────
      # With `archive-artifact` set, the lane downloads the run's test
      # archive and runs its partition: it builds nothing. The archive is
      # extracted before the database bootstrap, into the same absolute
      # target directory the build used, so compile-time paths baked into
      # the binaries (`env!("CARGO_BIN_EXE_…")`) still resolve. An archive
      # that can't be downloaded (expired before a late re-run) or
      # extracted falls back to the lane's own build, with a warning.
      - name: Use the shared test archive
        id: mode
        if: steps.gate.outputs.should-run == 'true' && inputs.archive-artifact != ''
        env:
          NAME: ${{ inputs.name }}
          ARCHIVE_STATUS: ${{ inputs.archive-status }}
        run: |
          if [ "$ARCHIVE_STATUS" != "ready" ]; then
            echo "::error title=$NAME::the shared test build (the cargo-tests-archive job) did not produce the archive this lane runs from (state: ${ARCHIVE_STATUS:-unknown}). Its log has the cause; re-run it together with this lane."
            exit 1
          fi
          echo "dir=$RUNNER_TEMP/cargo-tests-archive" >> "$GITHUB_OUTPUT"

      - name: Download the test archive
        id: download
        if: steps.mode.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.archive-artifact }}
          path: ${{ steps.mode.outputs.dir }}

      - name: Extract the test archive
        id: extract
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          ARTIFACT: ${{ inputs.archive-artifact }}
          DIR: ${{ steps.mode.outputs.dir }}
          BUILD_TARGET_DIR: ${{ inputs.archive-target-dir }}
          BUILD_WORKSPACE_ROOT: ${{ inputs.archive-workspace-root }}
          BUILD_GITHUB_WORKSPACE: ${{ inputs.archive-github-workspace }}
        run: |
          set -euo pipefail
          file="$DIR/$ARTIFACT.tar.zst"
          ls -l "$file"
          # The build's paths, mapped onto this job's checkout (the same
          # path on every pod of one repository's runners).
          ws="$BUILD_WORKSPACE_ROOT"; td="$BUILD_TARGET_DIR"
          if [ -n "$BUILD_GITHUB_WORKSPACE" ] && [ "$BUILD_GITHUB_WORKSPACE" != "$GITHUB_WORKSPACE" ]; then
            case "$ws" in "$BUILD_GITHUB_WORKSPACE"|"$BUILD_GITHUB_WORKSPACE"/*) ws="$GITHUB_WORKSPACE${ws#"$BUILD_GITHUB_WORKSPACE"}" ;; esac
            case "$td" in "$BUILD_GITHUB_WORKSPACE"/*) td="$GITHUB_WORKSPACE${td#"$BUILD_GITHUB_WORKSPACE"}" ;; esac
            echo "::warning::the build ran in $BUILD_GITHUB_WORKSPACE, this lane in $GITHUB_WORKSPACE: paths compiled into the test binaries point at the build's"
          fi
          if [ "$(basename "$td")" = "target" ]; then
            to="$(dirname "$td")"
          else
            to="$RUNNER_TEMP/cargo-tests-extract"
            mkdir -p "$to" "$(dirname "$td")"
            ln -sfn "$to/target" "$td"
          fi
          start=$(date +%s)
          cargo nextest list --archive-file "$file" --workspace-remap "$ws" \
            --extract-to "$to" --extract-overwrite --list-type binaries-only > /dev/null
          echo "Extracted $(du -sh "$to/target" | cut -f1) to $td in $(( $(date +%s) - start ))s; this lane builds nothing."
          rm -f "$file"
          {
            echo "CARGO_TESTS_TARGET_DIR=$td"
            echo "CARGO_TESTS_WORKSPACE=$ws"
          } >> "$GITHUB_ENV"
          echo "mode=archive" >> "$GITHUB_OUTPUT"

      - name: Fall back to building this lane
        if: steps.mode.outcome == 'success' && steps.extract.outputs.mode != 'archive'
        env:
          NAME: ${{ inputs.name }}
          ARTIFACT: ${{ inputs.archive-artifact }}
        run: |
          echo "::warning title=$NAME::the test archive $ARTIFACT could not be downloaded or extracted (an artifact expires after cargo-tests-archive-retention-days), so this lane builds its own test binaries"

      - name: Check there is a command to run
        if: >-
          steps.gate.outputs.should-run == 'true' &&
          steps.extract.outputs.mode != 'archive' && inputs.command == ''
        env:
          NAME: ${{ inputs.name }}
        run: |
          echo "::error title=$NAME::this lane has no command to build and run its tests (set 'command', or 'packages' under rust-pipeline.yml@v3)"
          exit 1

      - name: Install PostgreSQL client
        if: >-
          steps.gate.outputs.should-run == 'true' &&
          inputs.with-postgres == 'true' &&
          (inputs.init-sql != '' || inputs.pre-test-script != '')
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            echo "Installing postgresql-client..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-client
            elif command -v apk >/dev/null 2>&1; then
              sudo apk add --no-cache postgresql-client
            else
              echo "::error::Cannot install psql — no supported package manager found"
              exit 1
            fi
          fi
          psql --version

      - name: Initialize database
        if: >-
          steps.gate.outputs.should-run == 'true' &&
          inputs.with-postgres == 'true' &&
          inputs.init-sql != ''
        env:
          PGHOST: ${{ env.PG_HOST }}
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: test_db
        run: psql -f ${{ inputs.init-sql }}

      - name: Run pre-test script
        if: >-
          steps.gate.outputs.should-run == 'true' &&
          inputs.with-postgres == 'true' &&
          inputs.pre-test-script != ''
        shell: bash
        env:
          PGHOST: ${{ env.PG_HOST }}
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: test_db
          DATABASE_URL: postgres://test:test@${{ env.PG_HOST }}:5432/test_db
        run: bash "${{ inputs.pre-test-script }}"

      # From the archive: `archive-command` (the lane's partition, nothing
      # built). Otherwise: `command`, exactly as v2 ran it.
      - name: Run cargo tests (with DATABASE_URL)
        if: steps.gate.outputs.should-run == 'true' && inputs.with-postgres == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          DATABASE_URL: postgres://test:test@${{ env.PG_HOST }}:5432/test_db
        run: ${{ (steps.extract.outputs.mode == 'archive' && inputs.archive-command) || inputs.command }}

      - name: Run cargo tests
        if: steps.gate.outputs.should-run == 'true' && inputs.with-postgres != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ (steps.extract.outputs.mode == 'archive' && inputs.archive-command) || inputs.command }}

      # Doc tests aren't in a nextest archive: the archive job ran them once
      # against its build. A lane that asked for them fails here on its own.
      - name: Doc tests (run by the cargo-tests-archive job)
        if: >-
          !cancelled() && steps.gate.outputs.should-run == 'true' &&
          steps.extract.outputs.mode == 'archive' && inputs.doctests-verdict != ''
        env:
          NAME: ${{ inputs.name }}
          VERDICT: ${{ inputs.doctests-verdict }}
        run: |
          case "$VERDICT" in
            passed) echo "This lane's doc tests passed in the cargo-tests-archive job." ;;
            failed) echo "::error title=$NAME::this lane's doc tests failed in the cargo-tests-archive job (its log and summary name the crate)"; exit 1 ;;
            *) echo "::error title=$NAME::the cargo-tests-archive job left no doc-test result for this lane ($VERDICT)"; exit 1 ;;
          esac
